# Secrets. DO NOT commit real values — replace the placeholders and apply, or
# (better) create this with `kubectl create secret generic` / a sealed-secret /
# an external secrets operator, and keep this file as a template only.
#
# Generate AUTH_SECRET with:  openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: central-devtron-secrets
  labels:
    app: central-devtron
type: Opaque
stringData:
  # Auth
  AUTH_SECRET: "REPLACE_WITH_openssl_rand_base64_48"
  ADMIN_EMAIL: "admin@devtron.ai"
  ADMIN_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  # Zoho Desk OAuth
  ZOHO_CLIENT_ID: "REPLACE"
  ZOHO_CLIENT_SECRET: "REPLACE"
  ZOHO_REFRESH_TOKEN: "REPLACE"
  # Devtron
  DEVTRON_API_TOKEN: "REPLACE"
