# Persistent storage for the SQLite database. This is what makes data survive
# pod rotation — the volume outlives the pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowhere-data
  labels:
    app: knowhere
spec:
  accessModes:
    - ReadWriteOnce            # SQLite has a single writer → single replica
  resources:
    requests:
      storage: 1Gi             # small; the DB is tiny. Grow later if needed.
  # storageClassName: standard # uncomment/set to your cluster's storage class
