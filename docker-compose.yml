# Run the full app as a single container locally (mirrors the K8s pod).
# Data persists in the named volume `knowhere_data`, just like the PVC.
#
#   docker compose up --build
#   open http://localhost:8080
services:
  app:
    build: .
    image: knowhere:latest
    container_name: knowhere
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/central.db
      ALLOW_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"          # local http
      AUTH_SECRET: change-me-locally-0123456789
      ADMIN_EMAIL: admin@devtron.ai
      ADMIN_PASSWORD: change-me-now-8+chars
      # Zoho / Devtron creds optional — omit to leave those modules at 503.
    volumes:
      - knowhere_data:/data
    restart: unless-stopped

volumes:
  knowhere_data:
