apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowhere
  labels:
    app: knowhere
spec:
  replicas: 1                    # SQLite is single-writer → keep at 1
  strategy:
    type: Recreate               # never run two pods on the RWO volume at once
  selector:
    matchLabels:
      app: knowhere
  template:
    metadata:
      labels:
        app: knowhere
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532            # makes the mounted PVC writable by the app user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knowhere
          image: knowhere:latest   # replace with your registry/tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: knowhere-config
            - secretRef:
                name: knowhere-secrets
          volumeMounts:
            - name: data
              mountPath: /data     # SQLite database lives here
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # only /data and /tmp are writable
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: knowhere-data
        - name: tmp
          emptyDir: {}
